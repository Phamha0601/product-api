name: Product API CD - Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-healthcheck:
    name: CI healthcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Start MongoDB and Product API (wait until healthy)
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Verify healthcheck status
        run: |
          for c in nammongodb product-api; do
            status=$(docker inspect --format '{{.State.Health.Status}}' $c)
            echo "$c: $status"
            if [ "$status" != "healthy" ]; then
              echo "ERROR: $c is not healthy"
              exit 1
            fi
          done

      - name: Test API health
        run: curl --fail http://localhost:3000/health

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  docker:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    needs: ci-healthcheck

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

      - name: Pull image from Docker Hub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

      - name: Verify Docker image
        run: docker image inspect ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
