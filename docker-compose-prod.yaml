services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    ports:
      - "27018:27017"
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    image: phamthithuha1231/product-api:latest
    container_name: product-api-prod
    ports:
      - "3001:3000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/productdb
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_prod_data: